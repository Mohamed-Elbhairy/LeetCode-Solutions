name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # يشتغل يومياً الساعة 9:00 مساءً بتوقيت مصر

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync LeetCode Submissions
        uses: joshcai/leetcode-sync@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'LeetCode'

      - name: Format LeetCode Files & Add Links Inside Folders
        run: |
          python -c "
          import os

          leetcode_dir = 'LeetCode'
          if os.path.exists(leetcode_dir):
              for root, dirs, files in os.walk(leetcode_dir):
                  if root == leetcode_dir:
                      continue
                  
                  folder_name = os.path.basename(root)
                  slug = folder_name.split('-', 1)[1] if '-' in folder_name else folder_name
                  problem_name = slug.replace('-', ' ').title()
                  problem_url = f'https://leetcode.com/problems/{slug}/'

                  for file in files:
                      file_path = os.path.join(root, file)
                      ext = os.path.splitext(file)[1]

                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      if ext in ['.cpp', '.java', '.cs', '.rs', '.js', '.ts']:
                          header = f'/*\n * Problem Name: {problem_name}\n * Problem Link: {problem_url}\n */\n\n'
                      elif ext == '.py':
                          header = f'\"\"\"\nProblem Name: {problem_name}\nProblem Link: {problem_url}\n\"\"\"\n\n'
                      else:
                          header = f'// Problem Link: {problem_url}\n\n'

                      if not content.startswith('/*') and not content.startswith('\"\"\"') and not content.startswith('// Problem Link'):
                          content = header + content
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(content)
          "

      - name: Commit and Push LeetCode Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git add LeetCode/
          if ! git diff --staged --quiet; then
            git commit -m "Sync LeetCode solutions with individual folders and links"
            git pull origin main --rebase || true
            git push
          fi
