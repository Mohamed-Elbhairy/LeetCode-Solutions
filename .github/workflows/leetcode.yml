name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # يشتغل يومياً الساعة 9:00 مساءً بتوقيت مصر

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync LeetCode Submissions
        uses: joshcai/leetcode-sync@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'LeetCode'

      - name: Structure Folders with Readme & Solution File
        run: |
          python -c "
          import os, shutil

          leetcode_dir = 'LeetCode'
          if os.path.exists(leetcode_dir):
              # تجميع الأكواد وإعادة ترتيبها في فولدرات مستقلة
              for root, dirs, files in os.walk(leetcode_dir):
                  if root == leetcode_dir:
                      continue
                  
                  folder_name = os.path.basename(root)
                  parts = folder_name.split('-', 1)
                  prob_num = parts[0] if len(parts) > 1 else ''
                  slug = parts[1] if len(parts) > 1 else parts[0]
                  
                  title_name = slug.replace('-', ' ').title()
                  display_title = f'{prob_num}. {title_name}' if prob_num else title_name
                  problem_url = f'https://leetcode.com/problems/{slug}/'

                  # إنشاء اسم المجلد المنظم لكل مسألة
                  clean_folder_name = f'{prob_num}_{slug.replace(\"-\", \"_\")}' if prob_num else slug.replace('-', '_')
                  target_folder = os.path.join(leetcode_dir, clean_folder_name)
                  os.makedirs(target_folder, exist_ok=True)

                  for file in files:
                      if file.startswith('README'):
                          continue
                      
                      file_path = os.path.join(root, file)
                      ext = os.path.splitext(file)[1]
                      
                      # قراءة الكود
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      # إضافة الترويسة داخل كود الحل
                      if ext in ['.cpp', '.java', '.cs', '.rs', '.js', '.ts']:
                          header = f'/*\n * Problem Name: {display_title}\n * Problem Link: {problem_url}\n */\n\n'
                      elif ext == '.py':
                          header = f'\"\"\"\nProblem Name: {display_title}\nProblem Link: {problem_url}\n\"\"\"\n\n'
                      else:
                          header = f'// Problem Link: {problem_url}\n\n'

                      if not content.startswith('/*') and not content.startswith('\"\"\"') and not content.startswith('// Problem Link'):
                          content = header + content

                      # حفظ ملف الحل باسم solution داخل فولدر المسألة
                      solution_filepath = os.path.join(target_folder, f'solution{ext}')
                      with open(solution_filepath, 'w', encoding='utf-8') as f:
                          f.write(content)

                  # إنشاء ملف README.md الخاص بالمسألة داخل الفولدر
                  readme_filepath = os.path.join(target_folder, 'README.md')
                  readme_content = f'# {display_title}\n\n' \
                                 f'🔗 **Problem Link:** [{display_title}]({problem_url})\n\n' \
                                 f'---\n\n' \
                                 f'### 💡 Solution\n' \
                                 f'Check the [`solution{ext}`](./solution{ext}) file for the complete code.'
                  
                  with open(readme_filepath, 'w', encoding='utf-8') as f:
                      f.write(readme_content)

              # تنظيف وتفريغ الفولدرات الفرعية القديمة التي أنشأتها الإضافة في الأول
              for item in os.listdir(leetcode_dir):
                  item_path = os.path.join(leetcode_dir, item)
                  if os.path.isdir(item_path) and '-' in item and not item.startswith('.'):
                      shutil.rmtree(item_path)
          "

      - name: Commit and Push LeetCode Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git add LeetCode/
          if ! git diff --staged --quiet; then
            git commit -m "Organize LeetCode: per-problem folders with README & solution"
            git pull origin main --rebase || true
            git push
          fi
